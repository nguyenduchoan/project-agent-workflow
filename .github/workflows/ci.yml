name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Verify package boundary
        run: python3 tests/verify_package.py
      - name: Check script syntax
        run: sh -n install.sh scripts/install.sh tests/test_install.sh
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tests
      - name: Run validator unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run end-to-end tests
        run: ./tests/test_install.sh

  agent-skills-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned Agent Skills reference validator
        run: |
          python3 -m pip install --disable-pip-version-check \
            click==8.3.1 strictyaml==1.7.3 python-dateutil==2.9.0.post0 six==1.17.0
          python3 -m pip install --disable-pip-version-check --no-deps \
            'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Assemble manifest-locked skill artifact
        run: python3 tests/assemble_skill.py "$RUNNER_TEMP/project-agent-workflow"
      - name: Run official Agent Skills validation
        run: skills-ref validate "$RUNNER_TEMP/project-agent-workflow"
